# ローカルで全体を試すための構成: アプリ + S3 互換ストレージ（RustFS）+ サンプルデータ投入。
#   docker compose up --build
#   → http://localhost:3000 （AUTH_PROVIDER=developer なので好きなメールでログインできる）
#   → http://localhost:9001 （RustFS コンソール, rustfsadmin / rustfsadmin）
# MinIO の公式イメージは公開レジストリから取れなくなったので、MinIO 互換の RustFS を使う（versity/versitygw でも動作確認済み）。
# 自分のアプリの compose に足すときは app サービスだけを持っていく（README 参照）
x-app-env: &app-env
  S3_ENDPOINT: http://s3:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: manuscripts
  S3_ACCESS_KEY_ID: rustfsadmin
  S3_SECRET_ACCESS_KEY: rustfsadmin
  S3_FORCE_PATH_STYLE: "true"
  TARGET_PREFIX: submissions/
  REVIEW_PREFIX: .review/
  STATUS_STRATEGY: tags

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      <<: *app-env
      # 認証: デモなので developer。実運用では gcp_iap / aws_alb / cloudflare_access / forwarded_header
      AUTH_PROVIDER: developer
      AUTH_ALLOW_DEVELOPER_IN_PRODUCTION: "true"
      SECRET_KEY: ${SECRET_KEY:-insecure-demo-secret-key-change-me}
      ADMIN_EMAILS: admin@example.com
      API_TOKENS: ${API_TOKENS:-demo-api-token}
      ADMIN_API_TOKENS: ${ADMIN_API_TOKENS:-demo-admin-token}
      PUBLIC_URL: http://localhost:3000
    volumes:
      - app-data:/data
    depends_on:
      seed:
        condition: service_completed_successfully

  s3:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - s3-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9000/health || wget -qO- http://localhost:9000/health || exit 1",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  # バケットを作り、scripts/sample/ の中身を submissions/ に投入する（アプリのコードは使わない）。
  # aws s3 sync はサイズと更新時刻が同じファイルを送らないので、2 回目以降の起動でオブジェクトタグ（承認ステータス）を消さない
  seed:
    image: amazon/aws-cli:latest
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://s3:9000
    volumes:
      - ./scripts/sample:/sample:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        aws configure set default.s3.addressing_style path
        aws s3api head-bucket --bucket manuscripts 2>/dev/null || aws s3 mb s3://manuscripts
        aws s3 sync /sample s3://manuscripts/submissions/ --no-progress
        echo "seeded"
    depends_on:
      s3:
        condition: service_healthy

volumes:
  app-data:
  s3-data:
